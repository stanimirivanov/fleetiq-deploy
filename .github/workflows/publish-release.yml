name: Publish immutable release packages
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed current main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-package-publication
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.5.1 --allow-scripts=pnpm@12.5.1 --strict-allow-scripts
      - run: pnpm install --frozen-lockfile
      - run: node tools/releases/cli.mjs authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEETIQ_SOURCE_REVISION: ${{ inputs.source_revision }}
  publish:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.5.1 --allow-scripts=pnpm@12.5.1 --strict-allow-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:install
      - run: pnpm manifests:install
      - run: pnpm check
      - run: pnpm packages:check
      - name: Publish qualified bytes with isolated registry credentials
        run: node tools/releases/cli.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEETIQ_SOURCE_REVISION: ${{ inputs.source_revision }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-package-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-reports/*.json
          if-no-files-found: error
          retention-days: 90
