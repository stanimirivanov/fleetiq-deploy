name: Deployment verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  structural:
    name: Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.5.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:install
      - run: pnpm check
        env:
          FLEETIQ_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: structural-${{ matrix.os }}
          path: .verification/*.json
          if-no-files-found: error
          retention-days: 7
  docker:
    name: Real HTTPS installation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.5.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:install
      - name: Install checksum-verified Compose
        run: node tools/install-compose.mjs
      - name: Fetch reviewed application sources
        run: pnpm local sources
        env:
          GH_TOKEN: ${{ secrets.FLEETIQ_SOURCE_READ_TOKEN }}
      - name: Build reviewed application sources (no source credential)
        run: pnpm local build
      - name: Qualify infrastructure (real browser sign-in is the next slice)
        run: pnpm qualify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docker-installation
          path: .verification/*.json
          if-no-files-found: error
          retention-days: 7
