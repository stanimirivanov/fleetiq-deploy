{{- if eq .Values.owner.role .Values.runtime.role }}
{{- fail "Migration owner and runtime role must be distinct" }}
{{- end }}
{{- if eq .Values.owner.passwordSecret .Values.runtime.passwordSecret }}
{{- fail "Migration owner and runtime password Secrets must be distinct" }}
{{- end }}
{{- $scoped := .Values.workloadDatabase }}
{{- if and .Values.externalNetworkPolicies (or (ne .Values.profile "local") (not $scoped) (not $scoped.retireLegacy) .Values.network) }}
{{- fail "External network policies require a local scoped installation with its legacy login retired and chart networking unset" }}
{{- end }}
{{- if and (not .Values.externalNetworkPolicies) (not .Values.network) }}
{{- fail "Chart network policies require network configuration" }}
{{- end }}
{{- if and $scoped (not $scoped.workloads) (not $scoped.maintenance) }}
{{- fail "An active scoped installation requires at least one workload" }}
{{- end }}
{{- if and $scoped (or (ne .Values.database "fleetiq") (and $scoped.migrationLogin $scoped.bootstrapLogin) (and (or $scoped.migrationLogin $scoped.bootstrapLogin) (not $scoped.maintenance))) }}
{{- fail "Scoped database provisioning requires database fleetiq, exclusive temporary identities, and maintenance for migration login" }}
{{- end }}
{{- if and $scoped (hasKey $scoped "rebuildCurrentLogin") }}
{{- if not (and .Values.externalNetworkPolicies $scoped.maintenance $scoped.retireLegacy (not $scoped.workloads) (not $scoped.bootstrapLogin) (ne (default false $scoped.migrationLogin) $scoped.rebuildCurrentLogin)) }}
{{- fail "Rebuild-current provisioning requires a fenced external-network installation with only the rebuild or migration login" }}
{{- end }}
{{- end }}
{{- if and $scoped (hasKey $scoped "rebuildCurrentObserverLogin") }}
{{- if not (and (hasKey $scoped "rebuildCurrentLogin") (eq $scoped.rebuildCurrentObserverLogin $scoped.rebuildCurrentLogin)) }}
{{- fail "The observer login must follow the fenced rebuild-current phase" }}
{{- end }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.clusterName }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  imageName: {{ .Values.image | quote }}
  instances: {{ .Values.instances }}
  enableSuperuserAccess: false
  primaryUpdateStrategy: {{ if eq (int .Values.instances) 1 }}unsupervised{{ else }}supervised{{ end }}
  storage:
    storageClass: {{ .Values.storage.className | quote }}
    size: {{ .Values.storage.size | quote }}
  resources: {{ toJson .Values.resources }}
  bootstrap:
    initdb:
      database: {{ .Values.database | quote }}
      owner: {{ .Values.owner.role | quote }}
      secret: { name: {{ .Values.owner.passwordSecret | quote }} }
  managed:
    roles:
      {{- if $scoped }}
      {{- $roles := dict }}
      {{- $_ := set $roles .Values.owner.role (dict "login" (default false $scoped.migrationLogin) "secret" .Values.owner.passwordSecret) }}
      {{- $_ := set $roles .Values.runtime.role (dict "login" (not $scoped.retireLegacy) "secret" .Values.runtime.passwordSecret) }}
      {{- range $name, $role := $roles }}
      - name: {{ $name | quote }}
        ensure: present
        login: {{ $role.login }}
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: false
        inRoles: []
        {{- if $role.login }}
        passwordSecret: { name: {{ $role.secret | quote }} }
        {{- else }}
        disablePassword: true
        {{- end }}
      {{- end }}
      {{- else }}
      - name: {{ .Values.runtime.role | quote }}
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: false
        inRoles: []
        passwordSecret: { name: {{ .Values.runtime.passwordSecret | quote }} }
      {{- end }}
  postgresql:
    parameters:
      password_encryption: scram-sha-256
      {{- with (dig "postgresql" "maxConnections" nil .Values.AsMap) }}
      max_connections: {{ . | quote }}
      {{- end }}
    pg_hba:
      {{- if and $scoped $scoped.maintenance }}
      {{- if $scoped.migrationLogin }}
      - {{ printf "hostssl fleetiq %s all scram-sha-256" .Values.owner.role | quote }}
      {{- else if $scoped.bootstrapLogin }}
      - hostssl fleetiq fleetiq_bootstrap_platform_operator all scram-sha-256
      {{- else if $scoped.rebuildCurrentLogin }}
      - hostssl fleetiq fleetiq_rebuild_current all scram-sha-256
      {{- if $scoped.rebuildCurrentObserverLogin }}
      - hostssl fleetiq fleetiq_rebuild_current_observer all scram-sha-256
      {{- end }}
      {{- end }}
      - host all all all reject
      {{- else }}
      {{- if dig "postgresql" "requireTLS" false .Values.AsMap }}
      - hostnossl all all all reject
      {{- end }}
      - hostssl all all all scram-sha-256
      {{- end }}
