{{- $candidate := eq .Values.profile "minimal-demo-candidate" -}}
{{- if $candidate -}}
{{- /* Enforce the offline-only selection even with --skip-schema-validation. */ -}}
{{- $expected := dict
  "profile" "minimal-demo-candidate"
  "clusterName" "fleetiq-db"
  "image" "registry.invalid/candidate/postgresql:18.4-system-trixie@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
  "instances" 1
  "database" "fleetiq"
  "owner" (dict "role" "fleetiq_migrator" "passwordSecret" "offline-candidate-migration-owner")
  "storage" (dict "className" "local-retained" "size" "4Gi")
  "resources" (dict "requests" (dict "cpu" "200m" "memory" "256Mi") "limits" (dict "cpu" "1" "memory" "768Mi")) -}}
{{- if ne (mustToJson .Values) (mustToJson $expected) -}}
{{- fail "Use the exact reviewed offline minimal-demo-candidate values" -}}
{{- end -}}
{{- end -}}
{{- if and (not $candidate) (eq .Values.owner.role .Values.runtime.role) }}
{{- fail "Migration owner and runtime role must be distinct" }}
{{- end }}
{{- if and (not $candidate) (eq .Values.owner.passwordSecret .Values.runtime.passwordSecret) }}
{{- fail "Migration owner and runtime password Secrets must be distinct" }}
{{- end }}
{{- $scoped := .Values.workloadDatabase }}
{{- if and $scoped (or (ne .Values.database "fleetiq") (and $scoped.migrationLogin $scoped.bootstrapLogin) (and (or $scoped.migrationLogin $scoped.bootstrapLogin) (not $scoped.maintenance))) }}
{{- fail "Scoped database provisioning requires database fleetiq, exclusive temporary identities, and maintenance for migration login" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.clusterName }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  imageName: {{ .Values.image | quote }}
  instances: {{ .Values.instances }}
  enableSuperuserAccess: false
  primaryUpdateStrategy: supervised
  storage:
    storageClass: {{ .Values.storage.className | quote }}
    size: {{ .Values.storage.size | quote }}
  resources: {{ toJson .Values.resources }}
  bootstrap:
    initdb:
      database: {{ .Values.database | quote }}
      owner: {{ .Values.owner.role | quote }}
      secret: { name: {{ .Values.owner.passwordSecret | quote }} }
  {{- if not $candidate }}
  managed:
    roles:
      {{- if $scoped }}
      {{- $roles := dict }}
      {{- $_ := set $roles .Values.owner.role (dict "login" (default false $scoped.migrationLogin) "secret" .Values.owner.passwordSecret) }}
      {{- $_ := set $roles .Values.runtime.role (dict "login" (not $scoped.retireLegacy) "secret" .Values.runtime.passwordSecret) }}
      {{- $bootstrap := "fleetiq_bootstrap_platform_operator" }}
      {{- if hasKey $roles $bootstrap }}
      {{- fail "Bootstrap role collides with an existing role" }}
      {{- end }}
      {{- $_ := set $roles $bootstrap (dict "login" (default false $scoped.bootstrapLogin) "secret" "fleetiq-db-bootstrap-platform-operator") }}
      {{- $known := list "serve --check-schema" "ingest-tcp" "replay-worker" "semantic-worker" "project-current" "analytics-worker" "notification-worker" "archive-worker" }}
      {{- range $command := $scoped.workloads }}
      {{- if not (has $command $known) }}
      {{- fail "Unknown scoped runtime workload" }}
      {{- end }}
      {{- end }}
      {{- range $command := $known }}
      {{- $suffix := first (splitList " " $command) }}
      {{- $name := printf "fleetiq_%s" (replace "-" "_" $suffix) }}
      {{- if hasKey $roles $name }}
      {{- fail "A workload role collides with an existing role" }}
      {{- end }}
      {{- $_ := set $roles $name (dict "login" (has $command $scoped.workloads) "secret" (printf "fleetiq-db-%s" $suffix)) }}
      {{- end }}
      {{- $secrets := dict }}
      {{- range $name, $role := $roles }}
      {{- if hasKey $secrets $role.secret }}
      {{- fail "Managed database password Secret names must be distinct" }}
      {{- end }}
      {{- $_ := set $secrets $role.secret true }}
      - name: {{ $name | quote }}
        ensure: present
        login: {{ $role.login }}
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: false
        inRoles: []
        {{- if $role.login }}
        passwordSecret: { name: {{ $role.secret | quote }} }
        {{- else }}
        disablePassword: true
        {{- end }}
      {{- end }}
      {{- else }}
      - name: {{ .Values.runtime.role | quote }}
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: false
        inRoles: []
        passwordSecret: { name: {{ .Values.runtime.passwordSecret | quote }} }
      {{- end }}
  {{- end }}
  postgresql:
    parameters:
      password_encryption: scram-sha-256
      {{- if $candidate }}
      max_connections: "64"
      {{- end }}
    pg_hba:
      {{- if and $scoped $scoped.maintenance }}
      {{- if $scoped.migrationLogin }}
      - {{ printf "hostssl fleetiq %s all scram-sha-256" .Values.owner.role | quote }}
      {{- else if $scoped.bootstrapLogin }}
      - hostssl fleetiq fleetiq_bootstrap_platform_operator all scram-sha-256
      {{- end }}
      - host all all all reject
      {{- else }}
      - hostssl all all all scram-sha-256
      {{- end }}
