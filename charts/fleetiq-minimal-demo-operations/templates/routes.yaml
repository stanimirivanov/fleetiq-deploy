{{- if or (eq .Values.operation "migration-route") (eq .Values.operation "bootstrap-route") (eq .Values.operation "administrative-route") (eq .Values.operation "reclaim-route") }}
{{- $data := .Release.Namespace }}
{{- if or (not (regexMatch "^[a-z][a-z0-9]*(-[a-z0-9]+)*-data$" $data)) (gt (len $data) 37) }}
{{- fail "Select the delegated data namespace" }}
{{- end }}
{{- $namespaceLabel := "k8s:io.kubernetes.pod.namespace" }}
{{- $accountLabel := "io.cilium.k8s.policy.serviceaccount" }}
{{- $clientNamespace := $data }}
{{- $labels := dict }}
{{- $phase := trimSuffix "-route" .Values.operation }}
{{- $support := printf "%s-demo-support" (trimSuffix "-data" $data) }}
{{- $reclaim := eq $phase "reclaim" }}
{{- $nonRoutine := list (dict "key" "k8s-infrastructure.io/demo-routine" "operator" "DoesNotExist") }}
{{- if eq $phase "migration" }}
{{- $clientNamespace = printf "%s-releases" (trimSuffix "-data" $data) }}
{{- $workflow := required "Select the approved migration Workflow name" .Values.workflowName }}
{{- if or (gt (len $workflow) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $workflow)) }}
{{- fail "Select a valid exact migration Workflow name" }}
{{- end }}
{{- $labels = dict $accountLabel "release-executor" "app.kubernetes.io/component" "fleetiq-demo-database-maintenance" "workflows.argoproj.io/workflow" $workflow }}
{{- else }}
{{- $attempt := required "Select the approved administrative attempt" .Values.attempt }}
{{- if not (regexMatch "^demo-launch-[a-f0-9]{24}$" $attempt) }}
{{- fail "Select the exact approved administrative attempt" }}
{{- end }}
{{- $labels = dict $accountLabel (replace "launch" "run" $attempt) "k8s-infrastructure.io/demo-attempt" $attempt }}
{{- end }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fleetiq-demo-{{ $phase }}-client
  namespace: {{ $clientNamespace }}
spec:
  endpointSelector:
    matchLabels: {{ toJson $labels }}
  egress:
    - toEndpoints:
        - matchLabels:
            {{ $namespaceLabel }}: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: '53', protocol: UDP }
            - { port: '53', protocol: TCP }
    - toEndpoints:
        - matchLabels:
            {{ $namespaceLabel }}: {{ $data }}
            cnpg.io/cluster: fleetiq-db
      toPorts:
        - ports: [{ port: '5432', protocol: TCP }]
{{- if $reclaim }}
    - toEndpoints:
        - matchLabels:
            {{ $namespaceLabel }}: {{ $support }}
            app.kubernetes.io/name: fleetiq-object-store
          matchExpressions: {{ toJson $nonRoutine }}
      toPorts:
        - ports: [{ port: '9000', protocol: TCP }]
{{- end }}
{{- if eq $phase "migration" }}
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: '6443', protocol: TCP }]
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fleetiq-demo-{{ $phase }}-postgres
  namespace: {{ $data }}
spec:
  endpointSelector:
    matchLabels: { cnpg.io/cluster: fleetiq-db }
  ingress:
    - fromEndpoints:
        - matchLabels: {{ set $labels $namespaceLabel $clientNamespace | toJson }}
      toPorts:
        - ports: [{ port: '5432', protocol: TCP }]
{{- if $reclaim }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fleetiq-demo-reclaim-object-store
  namespace: {{ $support }}
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: fleetiq-object-store }
    matchExpressions: {{ toJson $nonRoutine }}
  ingress:
    - fromEndpoints:
        - matchLabels: {{ set $labels $namespaceLabel $data | toJson }}
          matchExpressions: {{ toJson $nonRoutine }}
      toPorts:
        - ports: [{ port: '9000', protocol: TCP }]
{{- end }}
{{- end }}
