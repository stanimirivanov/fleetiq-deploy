{{- $rebuild := eq .Values.operation "rebuild-current" }}
{{- if or (eq .Values.operation "bootstrap") $rebuild }}
{{- if or (not (regexMatch "^[a-z][a-z0-9]*(-[a-z0-9]+)*-data$" .Release.Namespace)) (gt (len .Release.Namespace) 37) }}
{{- fail "Select the delegated data namespace" }}
{{- end }}
{{- if not (regexMatch "^[a-z][a-z0-9-]{0,48}[a-z0-9]$" .Release.Name) }}
{{- fail "Select a fresh provider Job name" }}
{{- end }}
{{- $selection := mustFromJson .Values.backend }}
{{- $image := $selection.backend.reference }}
{{- if not (regexMatch "^ghcr[.]io/stanimirivanov/fleetiq-platform@sha256:[a-f0-9]{64}$" $image) }}
{{- fail "Select the immutable published backend" }}
{{- end }}
{{- if $rebuild }}
{{- if ne (printf "sha256:%s" (sha256sum .Values.backend)) .Values.backendDigest }}
{{- fail "Backend selection differs from the reviewed digest" }}
{{- end }}
{{- if or (ne $selection.format "fleetiq-minimal-demo-backend.v1") (ne $selection.backend.source.repository "stanimirivanov/fleetiq-platform") }}
{{- fail "Select the immutable published backend" }}
{{- end }}
{{- /* Match the pinned platform TenantId without rewriting the selected value. */}}
{{- $tenant := required "Select the reviewed rebuild tenant" .Values.tenant }}
{{- if or (not (regexMatch `^.{1,128}$` $tenant)) (regexMatch `\p{Cc}|^\p{Z}|\p{Z}$` $tenant) }}
{{- fail "Rebuild tenant must be an exact, valid FleetIQ identifier" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  # Render only. Pass operation.json to the provider for exact Job admission.
  operation.json: |
    {{- $name := "bootstrap" }}
    {{- $args := list "bootstrap-platform-operator" "--check-schema" }}
    {{- $urlSecret := "fleetiq-db-bootstrap-platform-operator-url" }}
    {{- if $rebuild }}
    {{- $name = "rebuild-current" }}
    {{- $args = list "rebuild-current" }}
    {{- $urlSecret = "fleetiq-db-rebuild-current-url" }}
    {{- end }}
    {{- $env := list (dict "name" "DATABASE_URL" "valueFrom" (dict "secretKeyRef" (dict "name" $urlSecret "key" "url"))) }}
    {{- if $rebuild }}
    {{- /* Escape kubelet EnvVar expansion so the process sees the exact tenant. */}}
    {{- $env = append $env (dict "name" "FLEETIQ_PROJECTION_REBUILD_TENANT" "value" (replace "$" "$$" .Values.tenant)) }}
    {{- else }}
    {{- range $key := list "FLEETIQ_BOOTSTRAP_ACTOR_ID" "FLEETIQ_BOOTSTRAP_AUTHORITY_ID" "FLEETIQ_BOOTSTRAP_EXTERNAL_SUBJECT" }}
    {{- $env = append $env (dict "name" $key "valueFrom" (dict "secretKeyRef" (dict "name" "fleetiq-bootstrap-operator" "key" $key))) }}
    {{- end }}
    {{- end }}
    {{- $container := dict
      "name" $name
      "image" $image
      "imagePullPolicy" "Never"
      "command" (list "/usr/local/bin/fleetiq-server")
      "args" $args
      "env" $env
      "volumeMounts" (list (dict "name" "database-ca" "mountPath" "/etc/fleetiq/database" "readOnly" true))
      "resources" (dict "requests" (dict "cpu" "100m" "memory" "192Mi") "limits" (dict "cpu" "1" "memory" "384Mi"))
      "securityContext" (dict "readOnlyRootFilesystem" true) }}
    {{- $pod := dict
      "securityContext" (dict "runAsUser" 10001 "runAsGroup" 10001)
      "volumes" (list (dict "name" "database-ca" "configMap" (dict "name" "workload-database-ca")))
      "containers" (list $container) }}
    {{- dict "name" .Release.Name "namespace" .Release.Namespace "deadlineSeconds" 300 "podSpec" $pod | toPrettyJson | nindent 4 }}
{{- end }}
