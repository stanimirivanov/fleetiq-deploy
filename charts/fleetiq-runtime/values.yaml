# Deliberately incomplete: select reviewed artifacts and existing environment inputs.
# Empty required values fail schema validation instead of producing an unsafe install.
profile: local
maintenance: false
imagePullSecrets: []
public:
  host: ''
  # Browser-facing port, independent of the Gateway/node listener.
  port: 443
gateway:
  className: ''
  certificateSecret: ''
  listenerPort: 443
  # Cilium Gateway uses its reserved ingress identity, not a gateway Pod identity.
  ingressMode: pod-selector
backend:
  image: ''
  replicas: 1
  databaseSecret:
    name: ''
    key: url
  databaseTrust:
    name: ''
    key: ca.crt
  oidc:
    issuer: ''
    clientId: ''
    authority: ''
    clientSecret:
      name: ''
      key: client-secret
    # An optional public CA augments, never replaces, the provider's normal trust.
    additionalTrust:
      name: ''
      key: ca.crt
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: '1', memory: 256Mi }
edge:
  image: ''
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: '1', memory: 128Mi }
network:
  databaseNamespace: ''
  databaseCluster: ''
  gatewayNamespace: ''
  gatewayPodLabels: {}
  dnsNamespace: kube-system
  dnsPodLabels: { k8s-app: kube-dns }
  # Explicit HTTPS discovery/JWKS/token destinations, not unrestricted egress.
  oidcCidrs: []
# Explicit opt-in; no process health API exists for these producer workers.
analytics:
  enabled: false
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    configurationSecret: ''
    # Exact receiver IPv4 ranges on HTTPS/443; no arbitrary destination ports.
    receiverCidrs: []
