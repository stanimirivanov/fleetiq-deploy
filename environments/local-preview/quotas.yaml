apiVersion: v1
kind: ResourceQuota
metadata:
  name: fleet-budget
  namespace: fleetiq-local
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 1Gi
    limits.cpu: '8'
    limits.memory: 2Gi
    pods: '12'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fleet-data-budget
  namespace: fleetiq-data
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '4'
    limits.memory: 4Gi
    requests.storage: 40Gi
    persistentvolumeclaims: '4'
    pods: '6'
