# Preparation only: apply after exact-target ownership checks and explicit approval.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fleet-budget
  namespace: fleetiq-apps
  labels:
    app.kubernetes.io/part-of: fleetiq
    k8s-infrastructure.io/consumer: fleetiq
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "6"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fleet-data-budget
  namespace: fleetiq-data
  labels:
    app.kubernetes.io/part-of: fleetiq
    k8s-infrastructure.io/consumer: fleetiq
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    requests.storage: 8Gi
    persistentvolumeclaims: "4"
    pods: "4"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fleet-release-budget
  namespace: fleetiq-releases
  labels:
    app.kubernetes.io/part-of: fleetiq
    k8s-infrastructure.io/consumer: fleetiq
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "2"
    count/jobs.batch: "2"
