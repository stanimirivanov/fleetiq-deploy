# Explicit development only; never an artifact lock or acceptance recipe.
services:
  ui-dev:
    image: ${FLEETIQ_DEV_NODE_IMAGE:?Missing pinned development Node runtime}
    pull_policy: never
    user: ${FLEETIQ_DEV_USER:?Missing nonroot developer}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    tmpfs: ['/tmp:size=256m,mode=1777,nosuid']
    labels:
      com.fleetiq.deploy.owner: ${FLEETIQ_OWNER:?Missing owner}
      com.fleetiq.development: ${FLEETIQ_DEV_FINGERPRINT:?Missing development fingerprint}
    working_dir: /workspace/apps/web
    entrypoint: [/usr/local/bin/node]
    command: [/workspace/node_modules/vite/bin/vite.js, --config, /opt/fleetiq/vite.config.mjs, --configLoader, native]
    environment:
      FLEETIQ_CONNECTED_ORIGIN: https://fleet.fleetiq.test:58443
    networks: [application]
    volumes:
      - type: bind
        source: ${FLEETIQ_DEV_UI_SOURCE:?Missing owned UI source}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FLEETIQ_DEV_VITE_FILE:?Missing owned development wrapper}
        target: /opt/fleetiq/vite.config.mjs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /usr/local/bin/node, -e, "fetch('http://127.0.0.1:5173/@vite/client').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
  edge:
    volumes:
      - type: bind
        source: ${FLEETIQ_DEV_CADDY_FILE:?Missing owned development edge config}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
