apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -withdraw-v1
resources:
  - ../../rebuild-current
generatorOptions:
  immutable: true
configMapGenerator:
  - name: rebuild-owner-inputs
    envs: [reviewed-owner.env]
    files: [inventory.json]
patches:
  - target:
      group: argoproj.io
      kind: WorkflowTemplate
      name: rebuild-current-owner
    patch: |
      - op: test
        path: /spec/templates/0/container/args/4
        value: --file=/operation/unselected.sql
      - op: replace
        path: /spec/templates/0/container/args/4
        value: --file=/operation/rebuild-current/withdraw.sql
      - op: add
        path: /spec/volumes/1/configMap/items/-
        value: { key: rebuild-withdraw.sql, path: rebuild-current/withdraw.sql }
