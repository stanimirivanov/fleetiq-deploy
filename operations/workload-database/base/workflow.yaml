apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: workload-database-v1
spec:
  entrypoint: maintenance
  serviceAccountName: release-executor
  activeDeadlineSeconds: 900
  synchronization:
    mutexes:
    - name: fleetiq-workload-database
  arguments:
    parameters:
    - name: release-digest
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: database-ca
    configMap:
      name: workload-database-ca
  - name: operation
    configMap:
      name: workload-database-sql
  templates:
  - name: maintenance
    steps:
    - - name: fence
        template: fence
    - - name: migrate
        template: migrate
    - - name: grant
        template: grant
    - - name: verify
        template: verify
  - name: fence
    container:
      image: invalid.invalid/psql
      command:
      - psql
      args:
      - -X
      - --no-password
      - --set=ON_ERROR_STOP=1
      - --set=release_digest={{workflow.parameters.release-digest}}
      - --file=/operation/context.sql
      - --file=/operation/fence.sql
      env: &psqlEnvironment
      - &ownerPassword
        name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: workload-database-owner
            key: password
      - name: PGDATABASE
        value: fleetiq
      - name: PGPORT
        value: '5432'
      - name: PGSSLMODE
        value: verify-full
      - name: PGSSLROOTCERT
        value: /etc/fleetiq/database/ca.crt
      - name: PGCONNECT_TIMEOUT
        value: '5'
      - name: FLEETIQ_MIGRATION_INVENTORY
        valueFrom:
          configMapKeyRef:
            name: workload-database-sql
            key: inventory.json
      volumeMounts: &psqlMounts
      - &caMount
        name: database-ca
        mountPath: /etc/fleetiq/database
        readOnly: true
      - name: operation
        mountPath: /operation
        readOnly: true
      securityContext: &containerSecurity
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      resources: &psqlResources
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
      envFrom:
      - &reviewedInputs
        configMapRef:
          name: workload-database-inputs
  - name: migrate
    container:
      image: invalid.invalid/fleetiq-migrate
      command:
      - /usr/local/bin/fleetiq-server
      args:
      - migrate
      env:
      - *ownerPassword
      - name: DATABASE_URL
        value: postgresql://$(PGUSER)@$(PGHOST):5432/fleetiq?sslmode=verify-full&sslrootcert=/etc/fleetiq/database/ca.crt
      volumeMounts:
      - *caMount
      securityContext: *containerSecurity
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: '1'
          memory: 384Mi
      envFrom:
      - *reviewedInputs
  - name: grant
    container:
      image: invalid.invalid/psql
      command:
      - psql
      args:
      - -X
      - --no-password
      - --set=ON_ERROR_STOP=1
      - --set=release_digest={{workflow.parameters.release-digest}}
      - --file=/operation/context.sql
      - --file=/operation/grant.sql
      env: *psqlEnvironment
      volumeMounts: *psqlMounts
      securityContext: *containerSecurity
      resources: *psqlResources
      envFrom:
      - *reviewedInputs
  - name: verify
    container:
      image: invalid.invalid/psql
      command:
      - psql
      args:
      - -X
      - --no-password
      - --set=ON_ERROR_STOP=1
      - --set=release_digest={{workflow.parameters.release-digest}}
      - --file=/operation/context.sql
      - --file=/operation/verify.sql
      env: *psqlEnvironment
      volumeMounts: *psqlMounts
      securityContext: *containerSecurity
      resources: *psqlResources
      envFrom:
      - *reviewedInputs
